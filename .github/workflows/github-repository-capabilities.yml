name: Repository GitHub capability probe v3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify repository-scoped PAT read capabilities
        env:
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
          GH_REPO_ACC: ${{ secrets.GH_REPO_ACC }}
          TARGET_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil, subprocess, sys, tempfile, urllib.error, urllib.request
          from pathlib import Path

          OWNER="FloCola"
          PRIVATE_REPOS=(
              "MailMCP","OpsWorkbench","Monitoring","Orbit","api-client-rs","WebDesktop",
              "Vorlage_MkDocs","sophos-exclusion-tool","Infrastruktur","Bibliotheken",
              "Serverwartung","AISpotlight","Pwsh-Messung","Deployments","miniOps",
              "web-ui-kit","Python-Markdown","Windows","exact-set-core-rs","Vorlagen","Bridge365",
          )
          token=os.environ.get("GH_REPO_TOKEN","")
          expected=os.environ.get("GH_REPO_ACC","").strip()
          target=os.environ["TARGET_REPOSITORY"]

          if not token:
              print(json.dumps({"status":"TOKEN_NOT_CONFIGURED"}))
              raise SystemExit(1)

          def api(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,method=method,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"FloCola-repository-capability/3",
                  "Content-Type":"application/json",
              })
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      raw=response.read(1048577)
                      if len(raw)>1048576:
                          raise RuntimeError("RESPONSE_LIMIT")
                      return response.status,json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  raw=exc.read(1048577)
                  if len(raw)>1048576:
                      raise RuntimeError("ERROR_RESPONSE_LIMIT")
                  return exc.code,None

          code,user=api("GET","https://api.github.com/user")
          if code!=200 or not user:
              print(json.dumps({"status":"TOKEN_AUTH_FAILED","http":code}))
              raise SystemExit(1)
          login=user.get("login","")
          if login.casefold()!=OWNER.casefold():
              print(json.dumps({"status":"TOKEN_OWNER_MISMATCH"}))
              raise SystemExit(1)

          code,repo=api("GET","https://api.github.com/repos/"+target)
          if code!=200 or not repo or repo.get("full_name")!=target:
              print(json.dumps({"status":"REPOSITORY_ACCESS_FAILED","http":code}))
              raise SystemExit(1)

          checks={}
          endpoints={
              "contents":"contents?per_page=1",
              "actions":"actions/workflows?per_page=1",
              "secret_metadata":"actions/secrets?per_page=1",
              "variables":"actions/variables?per_page=1",
              "rulesets":"rulesets?per_page=1",
              "issues":"issues?state=open&per_page=1",
              "pull_requests":"pulls?state=open&per_page=1",
          }
          for name,suffix in endpoints.items():
              status,_=api("GET",f"https://api.github.com/repos/{target}/{suffix}")
              checks[name]="READ_VERIFIED" if status==200 else f"HTTP_{status}"

          owner,name=target.split("/",1)
          query="""query($owner:String!,$name:String!){repository(owner:$owner,name:$name){hasDiscussionsEnabled viewerPermission}}"""
          status,graph=api("POST","https://api.github.com/graphql",{"query":query,"variables":{"owner":owner,"name":name}})
          if status!=200 or not graph or graph.get("errors"):
              checks["discussions"]="GRAPHQL_REJECTED"
          else:
              node=(graph.get("data") or {}).get("repository")
              if not node:
                  checks["discussions"]="GRAPHQL_INCOMPLETE"
              else:
                  checks["discussions"]="READ_VERIFIED" if node["hasDiscussionsEnabled"] else "DISABLED"

          wiki="DISABLED" if not repo.get("has_wiki") else "UNKNOWN"
          if repo.get("has_wiki"):
              git=shutil.which("git")
              if not git:
                  wiki="GIT_NOT_FOUND"
              else:
                  with tempfile.TemporaryDirectory(prefix="repo-wiki-probe-") as td:
                      ask=Path(td)/"askpass.py"
                      ask.write_text(
                          "#!"+sys.executable+"\n"
                          "import os,sys\n"
                          "p=sys.argv[1]\n"
                          "if 'github.com' not in p: sys.exit(1)\n"
                          "if p.startswith('Username'): print(os.environ['WIKI_LOGIN'])\n"
                          "elif p.startswith('Password'): print(os.environ['WIKI_TOKEN'])\n"
                          "else: sys.exit(1)\n",
                          encoding="utf-8",
                      )
                      ask.chmod(0o700)
                      env={
                          "PATH":os.defpath,"HOME":td,"XDG_CONFIG_HOME":td,
                          "GIT_CONFIG_NOSYSTEM":"1","GIT_CONFIG_GLOBAL":os.devnull,
                          "GIT_TERMINAL_PROMPT":"0","GIT_ASKPASS":str(ask),
                          "WIKI_LOGIN":login,"WIKI_TOKEN":token,"LC_ALL":"C",
                      }
                      p=subprocess.run(
                          [git,"-c","credential.helper=","-c","http.followRedirects=false",
                           "ls-remote","--symref",f"https://github.com/{target}.wiki.git","HEAD"],
                          cwd=td,env=env,capture_output=True,timeout=30,check=False,
                      )
                      if p.returncode==0:
                          out=(p.stdout or b"").decode("utf-8","replace")
                          wiki="WIKI_GIT_READ_VERIFIED" if "ref: refs/heads/" in out else "WIKI_INITIALIZATION_REQUIRED"
                      else:
                          err=(p.stderr or b"").decode("utf-8","replace").casefold()
                          if "repository not found" in err:
                              wiki="WIKI_INITIALIZATION_REQUIRED"
                          elif "authentication failed" in err or "invalid username or password" in err:
                              wiki="WIKI_AUTHENTICATION_FAILED"
                          elif "permission denied" in err:
                              wiki="WIKI_PERMISSION_DENIED"
                          else:
                              wiki="WIKI_GIT_REJECTED"
          checks["wiki"]=wiki

          scope={}
          too_broad=[]
          unknown=[]
          target_name=target.split("/",1)[1]
          for other in PRIVATE_REPOS:
              if other==target_name:
                  continue
              status,_=api("GET",f"https://api.github.com/repos/{OWNER}/{other}")
              if status==200:
                  scope[other]="UNEXPECTED_ACCESS"
                  too_broad.append(other)
              elif status in (403,404):
                  scope[other]="BLOCKED"
              else:
                  scope[other]=f"HTTP_{status}"
                  unknown.append(other)

          acceptable={"READ_VERIFIED","DISABLED","WIKI_GIT_READ_VERIFIED","WIKI_INITIALIZATION_REQUIRED"}
          bad={k:v for k,v in checks.items() if v not in acceptable}
          result={
              "probe_version":3,
              "repository":target,
              "identity":"FloCola",
              "account_secret_match":None if not expected else expected.casefold()==login.casefold(),
              "capabilities":checks,
              "exclusive_repo_scope":"VERIFIED_AGAINST_KNOWN_PRIVATE_REPOS" if not too_broad and not unknown else "FAILED",
              "unexpected_private_repo_access":too_broad,
              "scope_unknown":unknown,
              "writes":"NOT_TESTED",
              "status":"READ_PROBE_PASS" if not bad and not too_broad and not unknown else "READ_PROBE_FAILED",
          }
          print(json.dumps(result,indent=2))
          if result["status"]!="READ_PROBE_PASS":
              raise SystemExit(1)
          PY
